<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Layout: centered launcher. Animated canvas background sits behind the content; clock + toolbar on top, sections of link buttons below. Settings, Admin login and Admin open as modal sheets. Single dark look by choice. */
:root {
  --bg: #0b0d14;
  --surface: #151927;
  --surface-hi: #1d2336;
  --line: #2a3150;
  --fg: #eef0f8;
  --muted: #8b93b2;
  --accent: #7c8cff;
  --accent-2: #b07cff;
  --danger: #ff6b7d;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
main { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }

.tools { display: flex; justify-content: flex-end; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; font: 500 0.85rem var(--font-body); color: var(--fg);
  background: rgba(21,25,39,.72); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
  cursor: pointer; backdrop-filter: blur(8px); transition: border-color .15s ease, background .15s ease;
}
.pill:hover { border-color: var(--accent); background: rgba(29,35,54,.85); }
.pill svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

header { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 4rem); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 24px rgba(0,0,0,.45); }
.date { color: var(--muted); font-size: 1rem; }

#sections { display: flex; flex-direction: column; gap: 28px; }
.sec h2 { font-family: var(--font-display); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.link {
  display: flex; align-items: center; gap: 14px; min-width: 0; width: 100%; text-align: left;
  font: inherit; padding: 18px 20px; color: var(--fg); cursor: pointer;
  background: rgba(21,25,39,.78); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}
.link:hover { background: rgba(29,35,54,.9); border-color: var(--accent); transform: translateY(-2px); }
.badge {
  flex: none; width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: #0b0d14;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.name { min-width: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { color: var(--muted); margin: 0; font-size: 0.9rem; }
footer { text-align: center; color: var(--muted); font-size: 0.8rem; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

/* Modals */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: rgba(5,6,12,.72); backdrop-filter: blur(6px);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { width: 100%; max-width: 580px; max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 22px; }
.sheet.narrow { max-width: 400px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0; }
.sheet h4 { font-family: var(--font-display); font-weight: 500; font-size: 0.75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.x { background: none; border: 0; color: var(--muted); font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 2px 8px; border-radius: 8px; }
.x:hover { color: var(--fg); background: var(--surface-hi); }
.bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { text-align: left; cursor: pointer; font: 500 0.9rem var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.tile .sw { height: 46px; border-radius: 8px; }
.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; cursor: pointer; }
.switch small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.switch input { appearance: none; flex: none; width: 42px; height: 24px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s ease; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); transition: transform .15s ease; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
form.row { display: flex; flex-wrap: wrap; gap: 8px; }
input[type="text"], input[type="password"], select {
  flex: 1 1 140px; min-width: 0; font: 400 0.95rem var(--font-body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.btn { font: 500 0.9rem var(--font-body); color: #0b0d14; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { color: var(--fg); background: var(--surface-hi); border: 1px solid var(--line); }
.msg { margin: 0; min-height: 1.2em; font-size: 0.85rem; color: var(--muted); }
.msg.err { color: var(--danger); }
.manage { display: flex; flex-direction: column; gap: 14px; }
.msec { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.msec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface-hi); }
.msec-head strong { font-family: var(--font-display); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
.mrow span { min-width: 0; overflow-wrap: anywhere; }
.mrow small { color: var(--muted); display: block; }
.small-btn { flex: none; font: 500 0.8rem var(--font-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.small-btn:hover { color: var(--danger); border-color: var(--danger); }

textarea { display: block; width: 100%; min-height: 110px; resize: vertical; font: 400 0.9rem/1.4 var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.prev { flex: none; width: 36px; height: 36px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); background: var(--bg); }

.text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sub { color: var(--muted); font-size: 0.82rem; }
.lock { flex: none; margin-left: auto; color: var(--muted); display: grid; }
.lock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { margin: 0; }
.pwrow input { padding: 7px 10px; font-size: 0.85rem; }

/* Tab settings */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 0.8rem; color: var(--muted); }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; }

@media (prefers-reduced-motion: reduce) { .link, .pill { transition: none; } .link:hover { transform: none; } }

/* Standalone reset */
[hidden] { display: none !important; }
body { margin: 0; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <div class="tools">
    <button class="pill" id="openSettings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Settings
    </button>
    <button class="pill" id="openAdmin" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Admin
    </button>
  </div>

  <header>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </header>

  <div id="sections"></div>

  <footer>Sites and settings are saved in this browser.</footer>
</main>

<!-- Settings -->
<div class="overlay" id="settings" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-head"><h3 id="settingsTitle">Settings</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
    <section>
      <h4>Background</h4>
      <div class="bgs" id="bgTiles"></div>
    </section>
    <section>
      <h4>Tab</h4>
      <div class="field"><label for="optTitle">Tab title</label><input type="text" id="optTitle" placeholder="Link Hub" autocomplete="off"></div>
      <div class="field"><label for="optIcon">Icon address</label>
        <div class="row2"><input type="text" id="optIcon" placeholder="Paste an image or site address" autocomplete="off"><img id="iconPrev" class="prev" alt="" width="36" height="36" hidden></div>
      </div>
      <div class="row2">
        <button class="btn ghost" type="button" id="optIconPick">Upload an image</button>
        <input type="file" id="optIconFile" accept="image/*" hidden>
        <button class="btn ghost" type="button" id="resetTab">Reset tab</button>
      </div>
      <p class="msg" id="tabMsg" role="status"></p>
    </section>
  </div>
</div>

<!-- Admin login -->
<div class="overlay" id="gate" hidden>
  <div class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="sheet-head"><h3 id="gateTitle">Admin login</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
    <form class="row" id="gateForm">
      <input type="password" id="gatePw" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Admin password">
      <button class="btn" type="submit" id="gateBtn">Unlock</button>
    </form>
    <p class="msg" id="gateMsg" role="status"></p>
  </div>
</div>

<!-- Locked section -->
<div class="overlay" id="secGate" hidden>
  <div class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="secGateTitle">
    <div class="sheet-head"><h3 id="secGateTitle">Locked section</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
    <form class="row" id="secGateForm">
      <input type="password" id="secGatePw" placeholder="Section password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Section password">
      <button class="btn" type="submit" id="secGateBtn">Open</button>
    </form>
    <p class="msg" id="secGateMsg" role="status"></p>
  </div>
</div>

<!-- Admin -->
<div class="overlay" id="admin" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="sheet-head"><h3 id="adminTitle">Admin panel</h3><button class="x" type="button" data-close aria-label="Close">&times;</button></div>
    <section>
      <h4>Add a section</h4>
      <form class="row" id="secForm">
        <input type="text" id="secName" placeholder="Section name" autocomplete="off" aria-label="Section name">
        <input type="password" id="secPw" placeholder="Password (optional)" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Section password (optional)">
        <button class="btn" type="submit">Add section</button>
      </form>
    </section>
    <section>
      <h4>Add a site</h4>
      <form class="row" id="siteForm">
        <input type="text" id="siteName" placeholder="Button name" autocomplete="off" aria-label="Button name">
        <input type="text" id="siteUrl" placeholder="https://example.com" autocomplete="off" inputmode="url" aria-label="Site address">
        <select id="siteSec" aria-label="Section"></select>
        <button class="btn" type="submit">Add site</button>
      </form>
    </section>
    <section>
      <h4>Bulk add sites</h4>
      <form id="bulkForm">
        <textarea id="bulkText" placeholder="One site per line. Use a name and an address, or just an address.&#10;Truffle https://example.com&#10;https://example.org" aria-label="Sites to add, one per line" spellcheck="false"></textarea>
        <div class="row2">
          <select id="bulkSec" aria-label="Section for bulk sites"></select>
          <button class="btn" type="submit">Add all</button>
        </div>
      </form>
    </section>
    <p class="msg" id="adminMsg" role="status"></p>
    <section>
      <h4>Sections and sites</h4>
      <div class="manage" id="manage"></div>
    </section>
    <section>
      <button class="btn ghost" type="button" id="resetBtn">Reset to defaults</button>
    </section>
  </div>
</div>

<script>
(function () {
  var KEY = "linkhub.v2";
  /* Admin password is stored only as a salted PBKDF2-SHA256 hash (210,000 rounds). */
  var PW_SALT = "eb44a6b9bb422ab192ce0b5dd47dc89b";
  var PW_HASH = "bb16397fda70f65521748186ea65959acb82974751104f8d796c04f51098a3b3";
  var PW_ITER = 210000;

  var DEFAULT = {
    settings: { bg: "aurora", tabTitle: "", favicon: "" },
    sections: [{
      id: "proxies", name: "Proxies",
      links: [
        { id: "l1", name: "Lucide1", url: "https://s3.amazonaws.com/camzontop/study" },
        { id: "l2", name: "Truffle", url: "https://health.wvpreschool.org/" },
        { id: "l3", name: "Lucide3", url: "https://pirettisports.com/" },
        { id: "l4", name: "Lucide2", url: "https://testingcf.jsdelivr.net/gh/lucideproxy/svg@latest/index.svg" }
      ]
    }]
  };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) {
        var d = JSON.parse(r);
        if (d && Array.isArray(d.sections)) { d.settings = Object.assign({}, DEFAULT.settings, d.settings); if (d.settings.bg === "bubbles") d.settings.bg = "fireflies"; return d; }
      }
    } catch (e) {}
    return clone(DEFAULT);
  }
  var state = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "class") n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    (Array.isArray(kids) ? kids : kids == null ? [] : [kids]).forEach(function (c) {
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  /* ---------- Clock ---------- */
  function tick() {
    var d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    $("date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  }
  tick(); setInterval(tick, 15000);

  /* ---------- Links (buttons only: no visible address, no context menu) ---------- */
  function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return u; } }
  function badgeOf(name) {
    var m = name.match(/\d+$/);
    return (name.charAt(0) || "?").toUpperCase() + (m ? m[0] : "");
  }
  function go(url) {
    var title = (state.settings.tabTitle || "").trim() || "Link Hub";
    var icon = (state.settings.favicon || "").trim();
    var w = null;
    try { w = window.open("about:blank", "_blank"); } catch (e) {}
    if (w) {
      try {
        var d = w.document;
        d.title = title;
        if (icon) { var l = d.createElement("link"); l.rel = "icon"; l.href = icon; d.head.appendChild(l); }
        d.body.style.cssText = "margin:0;height:100vh;background:#fff";
        var f = d.createElement("iframe");
        f.src = url;
        f.style.cssText = "border:0;width:100%;height:100vh;display:block";
        f.setAttribute("allow", "fullscreen");
        d.body.appendChild(f);
        return;
      } catch (e) { try { w.location.href = url; return; } catch (e2) {} }
    }
    var a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function linkEl(l) {
    var b = el("button", { class: "link", type: "button", draggable: "false" }, [
      el("span", { class: "badge" }, badgeOf(l.name)),
      el("span", { class: "name" }, l.name)
    ]);
    b.addEventListener("click", function () { go(l.url); });
    b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    b.addEventListener("dragstart", function (e) { e.preventDefault(); });
    return b;
  }
  var view = null, unlockedSec = {};
  function lockIcon() {
    var s = el("span", { class: "lock", "aria-label": "Locked" });
    s.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    return s;
  }
  function openSection(sec) {
    if (sec.pw && !unlockedSec[sec.id]) { askSectionPassword(sec); return; }
    view = sec.id; render(); window.scrollTo(0, 0);
  }
  function render() {
    var root = $("sections");
    root.textContent = "";
    var cur = null;
    state.sections.forEach(function (s) { if (s.id === view) cur = s; });
    if (cur && (!cur.pw || unlockedSec[cur.id])) {
      var back = el("button", { class: "pill", type: "button" });
      back.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>All sections';
      back.addEventListener("click", function () { view = null; render(); });
      var g = el("div", { class: "grid" });
      cur.links.forEach(function (l) { g.appendChild(linkEl(l)); });
      if (!cur.links.length) g.appendChild(el("p", { class: "hint" }, "No sites in this section yet."));
      root.appendChild(el("section", { class: "sec" }, [el("div", { class: "sec-head" }, [back, el("h2", null, cur.name)]), g]));
      return;
    }
    view = null;
    if (!state.sections.length) {
      root.appendChild(el("p", { class: "hint" }, "No sections yet. Unlock Admin to add one."));
      return;
    }
    var grid = el("div", { class: "grid" });
    state.sections.forEach(function (sec) {
      var n = sec.links.length;
      var card = el("button", { class: "link", type: "button" }, [
        el("span", { class: "badge" }, (sec.name.charAt(0) || "?").toUpperCase()),
        el("span", { class: "text" }, [el("span", { class: "name" }, sec.name), el("span", { class: "sub" }, n + (n === 1 ? " site" : " sites"))])
      ]);
      if (sec.pw) card.appendChild(lockIcon());
      card.addEventListener("click", function () { openSection(sec); });
      grid.appendChild(card);
    });
    root.appendChild(el("section", { class: "sec" }, [el("h2", null, "Sections"), grid]));
  }

  /* ---------- Background effects ---------- */
  var cv = $("bg"), cx = cv.getContext("2d"), W = 0, H = 0, DPR = 1, cur = null, raf = 0, last = 0;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PAL = {
    aurora:   { name: "Aurora",   base: "#0b0d14", cols: ["124,140,255", "176,124,255", "60,200,190", "255,120,170"] },
    ocean:    { name: "Ocean",    base: "#07111a", cols: ["40,140,255", "0,200,210", "90,120,255", "30,220,170"] },
    sunset:   { name: "Sunset",   base: "#150c12", cols: ["255,120,90", "255,170,70", "220,80,150", "150,90,230"] },
    forest:   { name: "Forest",   base: "#08120f", cols: ["60,210,130", "130,220,80", "30,170,150", "90,200,200"] },
    ember:    { name: "Ember",    base: "#150a0b", cols: ["255,80,70", "255,140,50", "200,50,110", "255,190,90"] },
    amethyst: { name: "Amethyst", base: "#0e0a18", cols: ["170,90,255", "110,100,255", "240,110,220", "80,180,255"] }
  };
  function makeAurora(pal) {
    return {
      frame: function (t) {
        cx.globalCompositeOperation = "source-over";
        cx.fillStyle = pal.base; cx.fillRect(0, 0, W, H);

    if (unlocked) { renderAdmin(); msg(""); openModal("admin"); }
    else { gateMsg(""); openModal("gate"); }
  });
  document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeAll); });
  document.querySelectorAll(".overlay").forEach(function (o) { o.addEventListener("mousedown", function (e) { if (e.target === o) closeAll(); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });

  /* ---------- Start ---------- */
  if (!PAL[state.settings.bg]) state.settings.bg = "aurora";
  render(); renderTiles(); syncTabInputs(); applyTab(); resize(); setBg(state.settings.bg);
})();
</script>
